name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dabi_agendai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dabi_agendai_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dabi_agendai_ci
      ADMIN_NAME: Administrador
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PHONE: "11999990000"
    steps:
      - uses: actions/checkout@v7
      - name: Gerar credenciais efemeras deste job (nao sao segredos reais)
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx prisma db push
      - name: Criar tenant de teste para o e2e
        run: |
          yarn create-tenant \
            --name "Barbearia CI" \
            --domain "localhost:3002" \
            --admin-name "$ADMIN_NAME" \
            --admin-email "$ADMIN_EMAIL" \
            --admin-phone "$ADMIN_PHONE" \
            --admin-password "$ADMIN_PASSWORD"
      - run: yarn build
      - run: npx playwright install --with-deps chromium
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
